# v0.5 acceptance suite. Does not replace the four quality gates in
# quality-gates.yml. Those jobs still run on every pull request.
# This job runs on Node.js 20 and Node.js 22. The run step is not piped, so a
# failing acceptance suite fails the job. npm run test:acceptance exits 1 when
# the suite status is FAIL.

name: v0.5 acceptance

on:
  pull_request:
    branches:
      - integration/v05-core-base
      - integration/v05-final
      - core/v05-playable
  push:
    branches:
      - core/v05-*
      - integration/v05-*
      - final/*

permissions:
  contents: read

concurrency:
  group: v05-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  V05_ACCEPTANCE:
    name: V05_ACCEPTANCE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run acceptance suite
        env:
          CI_CHECK_NAME: V05_ACCEPTANCE
        run: npm run test:acceptance
